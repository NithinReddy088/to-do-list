# Fly.io config for the to-do backend.
# Customize `app` (must be globally unique) and `primary_region` before deploying.
app = "todo-api-CHANGEME"
primary_region = "iad"

[build]

[env]
  PORT = "4000"
  NODE_ENV = "production"
  # OTA bundles are written here; this lives on the persistent volume below so
  # uploaded updates survive restarts/redeploys.
  UPDATES_STORAGE_DIR = "/data/updates"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scales to zero when idle (free-friendly). The app cold-starts on the next
  # request (e.g. an OTA check). Set to 1 if you want it always warm.
  min_machines_running = 0

# Persistent disk for OTA bundles. Keep a SINGLE machine so all publishes/reads
# share one volume (uploads to one machine aren't visible to others).
[[mounts]]
  source = "todo_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Run migrations on every deploy (uses the DATABASE_URL secret).
[deploy]
  release_command = "bunx prisma migrate deploy"
